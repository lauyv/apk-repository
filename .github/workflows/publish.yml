name: Publish APK repository

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

concurrency:
  group: apk-repository-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TOOLS_DIR: ${{ github.workspace }}/build/tools

jobs:
  check-updates:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
          prune-cache: false
      - run: uv sync --locked
      - name: Check upstream releases against published manifest
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python -m apk_repository check-updates

  assemble:
    needs: check-updates
    if: github.event_name == 'workflow_dispatch' || needs.check-updates.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Validate configuration and run tests
        run: |
          uv run --locked python -m apk_repository validate
          uv run --locked ruff check .
          uv run --locked python -m unittest discover -s tests -v
      - name: Synchronize APKs for all channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python -m apk_repository build --apk "$TOOLS_DIR/apk" --output build/unsigned
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: unsigned-repository
          path: build/unsigned/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign:
    needs: assemble
    environment: repository-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: actions/download-artifact@v8.0.1
        with:
          name: unsigned-repository
          path: build/unsigned
      - name: Sign packages and indexes
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$APK_SIGNING_KEY" || { echo 'Set APK_SIGNING_KEY in the repository-signing environment.' >&2; exit 1; }
          umask 077
          key_file="$RUNNER_TEMP/apk-repository-signing.key"
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s\n' "$APK_SIGNING_KEY" > "$key_file"
          unset APK_SIGNING_KEY
          umask 022
          fakeroot uv run --locked python -m apk_repository sign --apk "$TOOLS_DIR/apk" --input build/unsigned --output build/public --key "$key_file"
          uv run --locked python -m apk_repository verify --apk "$TOOLS_DIR/apk" --site build/public
          uv run --locked python -c 'import json; d=json.load(open("build/public/manifest.json")); print("Public key SHA-256: `" + d["key_sha256"] + "`")' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: signed-repository
          path: build/public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  verify:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: actions/download-artifact@v8.0.1
        with:
          name: signed-repository
          path: build/public
      - name: Verify signed artifacts
        run: uv run --locked python -m apk_repository verify --apk "$TOOLS_DIR/apk" --site build/public
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/public
          retention-days: 1

  check-installation:
    needs: sign
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64_generic
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: actions/download-artifact@v8.0.1
        with:
          name: signed-repository
          path: build/public
      - name: Verify signed artifacts
        run: uv run --locked python -m apk_repository verify --apk "$TOOLS_DIR/apk" --site build/public
      - name: Cache OpenWrt rootfs
        uses: actions/cache@v6.1.0
        with:
          path: build/cache/openwrt/${{ matrix.arch }}
          key: openwrt-rootfs-v1-${{ matrix.arch }}-${{ hashFiles('scripts/check-openwrt.sh') }}
      - name: Check installation and upgrades in OpenWrt
        env:
          CHECK_ARCH: ${{ matrix.arch }}
        run: bash scripts/check-openwrt.sh build/public "$CHECK_ARCH"

  deploy:
    needs: [verify, check-installation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
