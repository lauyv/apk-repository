[project]
name = "apk-repository"
version = "0.1.0"
description = "Publish verified upstream OpenWrt APKs as signed APK v3 feeds"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
extend-exclude = ["build", "dist", "public"]

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
